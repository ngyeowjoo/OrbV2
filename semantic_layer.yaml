# ── THRESHOLDS ────────────────────────────────────────────────────────────────
# Named business rules. Used in retrieve_data(), system prompt, and AI reasoning.
# Change values here; they propagate everywhere automatically.

thresholds:
  # Underperformance
  consecutive_miss_min: 3         # N or more consecutive cycles below target = flag
  consecutive_miss_severe: 5      # 5+ consecutive = severe flag

  # Payout / attainment
  low_payout_pct: 50              # < 50% of SchemeMaxPayout = "low payout"
  near_miss_pct: 5                # within 5% of max = "near miss"
  high_attainment_pct: 90         # >= 90% of max = "high attainment"

  # PMGM / performance
  high_pmgm_bands:
    - Exceptional
    - Exceeds Expectations
  low_pmgm_bands:
    - Below Expectations
    - Unsatisfactory

  # New joiner
  new_joiner_months: 6            # joined within last N months = new joiner

  # Rankings
  top_n_default: 10               # default N for "top N" when not specified
  ranking_min_payout: 0           # exclude zero-payout from rankings (set to -1 to include)

  # Anomaly detection
  anomaly_high_pmgm_low_payout_pct: 50   # high PMGM + payout < this % = anomaly
  anomaly_low_pmgm_high_payout_pct: 95   # low PMGM + payout >= this % = reverse anomaly

  # Proration
  proration_threshold: 1.0        # ProrFactor < this value = considered prorated

  # Country / scope
  global_scope_keyword: ALL       # sentinel value for global access

