# semantic_layer.yaml  —  Orb v2 Semantic Layer Configuration
#
# Edit this file to change business rules, synonyms, and thresholds.
# Changes take effect on the next app reload (no code changes needed).
#
# Sections:
#   synonyms    — maps user language to canonical routing terms
#   thresholds  — named business rules used in retrieval and AI prompts
#   field_aliases — maps user-facing terms to actual column names
#   intent_hints  — extra phrases that force a specific intent

# ── SYNONYMS ─────────────────────────────────────────────────────────────────
# Format: canonical_term: [list of user phrases that mean the same thing]
# The normaliser replaces any matched phrase with the canonical term
# before routing and vector retrieval.

