[theme]
base            = "dark"
primaryColor    = "#F9A602"
backgroundColor = "#0a0a0a"
secondaryBackgroundColor = "#111111"
textColor       = "#e0e0e0"
font            = "monospace"

[server]
headless        = true
enableCORS      = false
enableXsrfProtection = false

[browser]
gatherUsageStats = false
